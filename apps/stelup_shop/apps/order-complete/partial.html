<div class="container py-5"><div class="card"><div class="card-body text-center py-5">
<p v-if="loading" role="status">Verifying your payment...</p><div v-if="error" class="alert alert-danger" role="alert">{{ error }}</div>
<template v-if="payment && payment.paid"><h1 class="h3">Payment confirmed</h1><p>Thank you. Order #{{ payment.invoiceNo }} has been paid.</p><p>Products: {{ payment.quote.currency.toUpperCase() }} {{ payment.quote.subtotal | money }}</p><p v-if="payment.quote.service_fee_minor>0">Service fee: {{ payment.quote.currency.toUpperCase() }} {{ payment.quote.service_fee | money }}</p><p><strong>Total paid: {{ payment.quote.currency.toUpperCase() }} {{ payment.quote.total | money }}</strong></p></template>
<template v-else-if="payment"><h1 class="h4">{{ payment.expired ? "Checkout expired" : "Payment is not confirmed yet" }}</h1><p class="text-muted">{{ payment.expired ? "Return to your cart to start a new checkout." : "Check again shortly. Your cart stays available until payment is verified." }}</p></template>
<button v-if="!loading && (!payment || !payment.paid)" type="button" class="btn btn-primary mr-2" @click="verify">Check payment status</button><a href="#/app/stelup_shop/checkout-cart" class="btn btn-default">Return to cart</a>
</div></div></div>
