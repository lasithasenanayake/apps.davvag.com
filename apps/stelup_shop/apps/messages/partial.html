<div class="container py-4">
  <div class="row">
    <div class="col-12 col-md-4 mb-3">
      <h1 class="h4 mb-3">Messages</h1>
      <p v-if="!messages.length" class="text-muted">No conversations yet.</p>
      <button type="button" class="btn btn-default w-100 text-left mb-2" v-for="m in messages" @click="downloadapp('stelup_shop','messaging',m,'Messages')">
        <span class="d-flex align-items-center">
          <img :src="'components/davvag-cms/soss-uploader/service/get/profile/'+m.m_from" :alt="m.name" class="rounded-circle mr-2" style="width: 40px; height: 40px; object-fit: cover;">
          <span style="min-width: 0;"><strong class="d-block text-truncate">{{ m.name }}</strong><small class="text-muted">{{ m.msgdate }}</small><span v-if="m.msgread==0" class="d-block small text-primary">Unread</span></span>
        </span>
      </button>
    </div>
    <div class="col-12 col-md-8" id="messagedock"></div>
  </div>
</div>
