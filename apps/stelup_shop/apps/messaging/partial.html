<div v-for="error in submitErrors" class="alert alert-danger" role="alert">{{ error }}</div>
<div class="mb-3 overflow-auto" style="max-height: 55vh; overflow-wrap: anywhere;"  id="message_data">
 
    <div class="d-flex align-items-start mb-3" v-for="c in messages">
      <div v-if="c.m_from==c.userboxid" class="col-auto" ><img :src="'components/davvag-cms/soss-uploader/service/get/profile/'+c.userboxid" class="rounded-circle" alt="" style="width: 40px; height: 40px; object-fit: cover;"></div>
      <div v-if="c.m_from==c.userboxid" class="col-auto" style="width: calc(100% - 60px);text-align: left;">{{ c.messagetext }}</div>
      <div v-if="c.m_from==c.inboxid" class="col-auto" style="width: calc(100% - 60px);text-align: right;">{{ c.messagetext }}</div>
      <div v-if="c.m_from==c.inboxid" class="col-auto" ><img :src="'components/davvag-cms/soss-uploader/service/get/profile/'+c.inboxid" class="rounded-circle" alt="" style="width: 40px; height: 40px; object-fit: cover;"></div>
    </div>
  
  
</div>
<div id="form-row" class="form-row align-items-center" style="padding-top: 5px;">
  <div class="col-auto" style="width: 40px;"><img :src="'components/davvag-cms/soss-uploader/service/get/profile/'+profile.id" class="rounded-circle" alt="" style="width: 40px; height: 40px; object-fit: cover;"></div>
  <div class="col-auto" style="flex: 1; min-width: 0;"><textarea aria-label="Write a message" class="form-control" v-model="message"  maxlength="500" style="width: 100%;height: 50px;" v-on:keyup="textOnChage" v-on:focus="textOnChage"></textarea></div>
  <div class="col-auto" ><button v-on:click="send(message)" class="btn btn-primary" style="height: 50px;">Send</button></div>
</div>
<div class="form-row align-items-center">
  <div class="col"></div>
  <div class="col"></div>
  <div class="col" style="text-align: right;">{{ TextLength }} / 500</div>
</div>
