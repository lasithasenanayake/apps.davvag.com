<div class="mb-3 overflow-auto" style="max-height: 55vh; overflow-wrap: anywhere;">
  <div class="d-flex align-items-start mb-3" v-for="c in comments">
    <div class="col-auto" ><img :src="'components/dock/soss-uploader/service/get/profile/'+c.pid" class="rounded-circle" alt="" style="width: 40px; height: 40px; object-fit: cover;"></div>
    <div class="col-auto">{{ c.comment }}</div>
    
  </div>
</div>
<div class="form-row align-items-center">
  <div class="col-auto" ><img :src="'components/dock/soss-uploader/service/get/profile/'+profile.id" class="rounded-circle" alt="" style="width: 40px; height: 40px; object-fit: cover;"></div>
  <div class="col-auto" style="flex: 1; min-width: 0;"><textarea aria-label="Write a comment" class="form-control" v-model="comment"  maxlength="500" style="width: 100%;height: 50px;"></textarea></div>
  
  <div class="col-auto"><button v-on:click="send(comment)" class="btn btn-primary" style="width: 100%;height: 50px;">Send</button></div>
</div>
<div class="form-row align-items-center">
  <div class="col"></div>
  <div class="col"></div>
  <div class="col" style="text-align: right;">{{ TextLength }} / 500</div>
</div>
