<section class="lmp"><nav><a href="#/app/lesson-market-place/">Catalog</a><a href="#/app/lesson-market-place/my-enrolments">My enrolments</a><a href="#/app/lesson-market-place/admin/packages">Manage packages</a><a href="#/app/lesson-market-place/admin/enrolments">Review requests</a></nav><h1>Manage lesson packages</h1><p v-if="busy" role="status">Loading…</p><p v-if="error" class="lmp-error" role="alert">{{error}}</p><form @submit.prevent="offset=0;load()"><label>Search packages<input v-model="search" maxlength="100"></label><button :disabled="busy">Search</button></form><a href="#/app/lesson-market-place/admin/package">Create package</a><p v-if="!busy&&!items.length" class="lmp-empty">No matching packages.</p><div class="lmp-scroll"><table><thead><tr><th>Package</th><th>Status</th><th>Published version</th><th></th></tr></thead><tbody><tr v-for="item in items" :key="item.id"><td>{{item.name}}</td><td>{{item.status}}</td><td>{{item.published_version_id||'Draft'}}</td><td><button @click="open(item)">Edit / preview</button></td></tr></tbody></table></div><div class="lmp-row"><button :disabled="busy||offset===0" @click="page(-1)">Previous</button><span>{{offset+1}}–{{Math.min(offset+20,total)}} of {{total}}</span><button :disabled="busy||offset+20>=total" @click="page(1)">Next</button></div></section>
