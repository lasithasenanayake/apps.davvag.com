[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "davvag-destination-scraper"
version = "0.1.0"
description = "Research travel destinations with OpenAI web search and submit them to DAVVAG."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=2.46.0,<3",
    "python-dotenv>=1.0.1,<2",
    "requests>=2.31.0,<3",
]

[project.scripts]
davvag-destination-scraper = "destination_scraper.cli:main"

[tool.setuptools.packages.find]
include = ["destination_scraper*"]
