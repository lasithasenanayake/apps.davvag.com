<div class="td-app"><div class="td-shell">
    <nav class="td-nav"><a class="td-brand" href="#/app/travel-destinations/admin"><span class="td-brand-mark"></span><span>Moderation desk</span></a><button class="td-link" @click="navigate('/admin')">Destination list</button></nav>
    <div class="td-section-head"><div><h1>Review queues</h1><p>Traveler submissions and community content awaiting a decision.</p></div><button class="td-button secondary" :disabled="loading" @click="load">Refresh</button></div>
    <div v-if="error" class="td-alert error">{{ error }}</div><div v-if="loading" class="td-loading">Preparing moderation queues…</div>
    <div v-if="notice" class="td-alert success">{{ notice }}</div>
    <template v-if="!loading && authorized">
        <section class="td-panel" v-for="queue in queueDefinitions" :key="queue.key" style="margin-bottom:18px">
            <h2>{{ queue.title }} <span class="td-badge">{{ collection(queue.key).length }}</span></h2>
            <div v-if="!collection(queue.key).length" class="td-empty">Queue is clear.</div>
            <div v-else class="td-table-wrap"><table class="td-table"><tbody><tr v-for="item in collection(queue.key)" :key="item.id"><td><strong>{{ item.name || item.review_title || item.report_type || item.reason || ('Record '+item.id) }}</strong><br><span>{{ item.short_summary || item.review_markdown || item.comment_markdown || item.description }}</span></td><td><div class="td-actions">
                <button v-for="action in queue.actions" :key="action.label" class="td-button secondary" :class="{warn:action.status==='Rejected'}" :disabled="actionKey" @click="moderate(queue,item,action)">{{ action.label }}</button>
            </div></td></tr></tbody></table></div>
        </section>
    </template>
    <section v-if="!loading && authorized" class="td-panel"><h2>Phase 2 publishing tools</h2><div class="td-tabs"><button :class="{active:adminForm==='collection'}" @click="adminForm='collection'">Collection</button><button :class="{active:adminForm==='availability'}" @click="adminForm='availability'">Availability</button><button :class="{active:adminForm==='translation'}" @click="adminForm='translation'">Translation</button></div><form v-if="adminForm==='collection'" class="td-form-grid" @submit.prevent="saveCollection"><label>Title<input class="td-input" v-model="collectionForm.title" required></label><label>Slug<input class="td-input" v-model="collectionForm.slug"></label><label class="full">Summary<textarea class="td-textarea" v-model="collectionForm.summary"></textarea></label><label class="full">Destination IDs<input class="td-input" v-model="collectionForm.destination_ids" placeholder="12, 24, 39"></label><label class="td-check"><input type="checkbox" v-model="collectionForm.is_featured"> Featured</label><button class="td-button">Publish collection</button></form><form v-if="adminForm==='availability'" class="td-form-grid" @submit.prevent="saveAvailability"><label>Destination ID<input class="td-input" type="number" v-model="availabilityForm.destination_id" required></label><label>Status<select class="td-select" v-model="availabilityForm.availability_status"><option>Available</option><option>Limited</option><option>Unavailable</option><option>Contact</option></select></label><label class="full">Inventory summary<textarea class="td-textarea" v-model="availabilityForm.inventory_summary"></textarea></label><label>Price from<input class="td-input" type="number" min="0" step="0.01" v-model="availabilityForm.price_from"></label><label>Currency<input class="td-input" maxlength="3" v-model="availabilityForm.currency_code"></label><label class="full">Provider booking URL<input class="td-input" type="url" v-model="availabilityForm.booking_url"></label><button class="td-button">Save availability</button></form><form v-if="adminForm==='translation'" class="td-form-grid" @submit.prevent="saveTranslation"><label>Destination ID<input class="td-input" type="number" v-model="translationForm.destination_id" required></label><label>Language code<input class="td-input" v-model="translationForm.language_code" required></label><label class="full">Translated name<input class="td-input" v-model="translationForm.name" required></label><label class="full">Translated summary<textarea class="td-textarea" v-model="translationForm.short_summary" required></textarea></label><label class="full">Translated description<textarea class="td-textarea" v-model="translationForm.description_markdown"></textarea></label><button class="td-button">Save translation</button></form></section>
    <div v-if="!loading && !authorized" class="td-alert error">Administrator access is required.</div>
</div></div>
