<nav class="cms-v7-nav" v-bind:data-variant="site.nav.variant">
    <div class="cms-v7-container cms-v7-nav-inner">
        <a class="cms-v7-brand" href="#/">
            <span class="cms-v7-brand-mark">
                <img v-if="site.logo" v-bind:src="site.logo" v-bind:alt="site.name">
                <span v-if="!site.logo">{{ initials }}</span>
            </span>
            <span>{{ site.name }}</span>
        </a>
        <div class="cms-v7-nav-links">
            <div class="cms-v7-nav-item" v-for="item in navItems" v-bind:key="item.id" v-bind:class="{'open': isMenuOpen(item), 'has-children': item.children.length}">
                <a class="cms-v7-nav-link" v-if="!item.children.length" v-bind:href="item.url" v-bind:target="item.target">{{ item.label }}</a>
                <button class="cms-v7-nav-menu-button" v-if="item.children.length" type="button" v-on:click="toggleMenu(item, $event)" v-bind:aria-expanded="isMenuOpen(item) ? 'true' : 'false'">
                    <span>{{ item.label }}</span>
                    <span class="cms-v7-nav-caret"></span>
                </button>
                <div class="cms-v7-nav-menu" v-if="item.children.length">
                    <a v-for="child in item.children" v-bind:key="child.id" v-bind:href="child.url" v-bind:target="child.target" v-on:click="closeMenu">{{ child.label }}</a>
                </div>
            </div>
            <a class="cms-v7-button" v-if="cta && cta.label" v-bind:href="cta.url" v-bind:target="cta.target">{{ cta.label }}</a>
        </div>
    </div>
</nav>
