<div class="container profile-v1-app">
  <div class="panel panel-default">
    <div class="panel-heading">
      <div class="panel-btns">
        <a v-on:click="navigateBack()" class="panel-close">x</a>
      </div>
      <h4 class="panel-title">Currency Configuration</h4>
    </div>
    <div class="panel-body">
      <div class="alert alert-danger" v-for="error in submitErrors">{{ error }}</div>
      <div class="alert alert-info" v-for="info in submitInfo">{{ info }}</div>
      <form class="form-horizontal" v-on:submit.prevent="save">
        <datalist id="currency-code-list">
          <option v-for="code in commonCodes" v-bind:value="code"></option>
        </datalist>
        <div class="form-group">
          <label class="col-sm-2 control-label">Currency Code</label>
          <div class="col-sm-2">
            <input type="text" class="form-control" list="currency-code-list" maxlength="3" v-model="form.code" v-on:input="normalizeCode">
          </div>
          <label class="col-sm-2 control-label">Numeric Code</label>
          <div class="col-sm-2">
            <input type="text" class="form-control" maxlength="3" v-model="form.numericCode" v-on:input="normalizeCode">
          </div>
          <label class="col-sm-2 control-label">Symbol</label>
          <div class="col-sm-2">
            <input type="text" class="form-control" v-model="form.symbol">
          </div>
        </div>
        <div class="form-group">
          <label class="col-sm-2 control-label">Name</label>
          <div class="col-sm-4">
            <input type="text" class="form-control" v-model="form.name">
          </div>
          <label class="col-sm-2 control-label">Exchange Rate</label>
          <div class="col-sm-4">
            <input type="number" step="0.000001" class="form-control" v-model="form.exchangeRate">
          </div>
        </div>
        <div class="form-group">
          <label class="col-sm-2 control-label">Decimals</label>
          <div class="col-sm-2">
            <input type="number" min="0" max="6" class="form-control" v-model="form.decimalPlaces">
          </div>
          <label class="col-sm-2 control-label">Base Currency</label>
          <div class="col-sm-2">
            <select class="form-control" v-model="form.isBase">
              <option value="N">No</option>
              <option value="Y">Yes</option>
            </select>
          </div>
          <label class="col-sm-2 control-label">Status</label>
          <div class="col-sm-2">
            <select class="form-control" v-model="form.status">
              <option value="active">Active</option>
              <option value="inactive">Inactive</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label class="col-sm-2 control-label">Order</label>
          <div class="col-sm-2">
            <input type="number" class="form-control" v-model="form.sortOrder">
          </div>
          <div class="col-sm-8">
            <button type="submit" class="btn btn-primary"><i class="fa fa-save"></i> Save</button>
            <button type="button" class="btn btn-default" v-on:click="clear"><i class="fa fa-eraser"></i> Clear</button>
          </div>
        </div>
      </form>
      <div class="table-responsive">
        <table class="table table-bordered table-hover">
          <thead>
            <tr>
              <th>Code</th>
              <th>Name</th>
              <th>Symbol</th>
              <th>Decimals</th>
              <th>Rate</th>
              <th>Base</th>
              <th>Status</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            <tr v-for="item in items">
              <td>{{ item.code }}</td>
              <td>{{ item.name }}</td>
              <td>{{ item.symbol }}</td>
              <td>{{ item.decimalPlaces }}</td>
              <td>{{ item.exchangeRate }}</td>
              <td>{{ item.isBase }}</td>
              <td>{{ item.status }}</td>
              <td>
                <button type="button" class="btn btn-default btn-sm" v-on:click="edit(item)"><i class="fa fa-pencil"></i> Edit</button>
                <button type="button" class="btn btn-default btn-sm" v-on:click="archive(item)"><i class="fa fa-ban"></i> Inactive</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
