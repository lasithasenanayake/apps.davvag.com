<section class="cm-page">
  <div class="cm-toolbar">
    <div>
      <h3>Attendance</h3>
    </div>
    <div class="btn-group">
      <button class="btn btn-default" v-on:click="refresh" title="Refresh"><span class="glyphicon glyphicon-refresh"></span></button>
      <button class="btn btn-default" v-on:click="openWeekly"><span class="glyphicon glyphicon-calendar"></span> Weekly</button>
      <button class="btn btn-default" v-on:click="navigate('../timetable')"><span class="glyphicon glyphicon-list-alt"></span> Slots</button>
      <button class="btn btn-primary" v-on:click="saveAttendance"><span class="glyphicon glyphicon-floppy-disk"></span> Save</button>
    </div>
  </div>

  <div class="cm-alerts">
    <div class="alert alert-danger" v-for="error in errors">{{ error }}</div>
    <div class="alert alert-info" v-for="message in info">{{ message }}</div>
  </div>

  <div class="cm-panel">
    <div class="cm-panel-header">
      <strong>Selection</strong>
      <span class="cm-muted" v-if="selectedSlot">{{ slotLabel(selectedSlot) }}</span>
    </div>
    <div class="cm-panel-body">
      <div class="cm-filter-strip">
        <label>Cohort<select v-model="filters.class_grade_id"><option value="">Select cohort</option><option v-for="classGrade in classGrades" v-bind:value="classGrade.id">{{ classGrade.name }}</option></select></label>
        <label>Subject<select v-model="filters.subject_id"><option value="">Select subject</option><option v-for="subject in subjects" v-bind:value="subject.id">{{ subject.code }} - {{ subject.title }}</option></select></label>
        <label>Time Slot<select v-model="filters.timetable_slot_id" v-on:change="applySlot(true)"><option value="">Select slot</option><option v-for="slot in visibleSlots()" v-bind:value="slot.id">{{ slotLabel(slot) }}</option></select></label>
        <button class="btn btn-primary" v-on:click="loadRoster"><span class="glyphicon glyphicon-search"></span> Load</button>
      </div>
    </div>
  </div>

  <div class="cm-panel">
    <div class="cm-panel-header">
      <strong>Students</strong>
      <div class="cm-inline-actions">
        <span class="cm-muted">{{ students.length }} listed</span>
        <button class="btn btn-xs btn-default" v-on:click="markAllPresent"><span class="glyphicon glyphicon-ok"></span> Present</button>
      </div>
    </div>
    <div class="cm-table">
      <table>
        <thead>
          <tr>
            <th>Present</th>
            <th>Student</th>
            <th>Status</th>
            <th>Note</th>
          </tr>
        </thead>
        <tbody>
          <tr v-for="student in students">
            <td><input class="cm-attendance-check" type="checkbox" v-model="student.present" v-on:change="syncStatus(student)"></td>
            <td>
              <strong>{{ student.student_name }}</strong>
              <div class="cm-muted">ID {{ student.student_id }}</div>
            </td>
            <td>
              <select v-model="student.status" v-on:change="syncPresent(student)">
                <option>present</option>
                <option>absent</option>
                <option>late</option>
                <option>excused</option>
              </select>
              <span v-bind:class="attendanceClass(student.status)">{{ student.status }}</span>
            </td>
            <td><input v-model="student.note"></td>
          </tr>
          <tr v-if="students.length == 0"><td colspan="4">Select a cohort and time slot to load students.</td></tr>
        </tbody>
      </table>
    </div>
    <div class="cm-panel-body">
      <div class="cm-actions">
        <button class="btn btn-primary" v-on:click="saveAttendance"><span class="glyphicon glyphicon-floppy-disk"></span> Save Attendance</button>
      </div>
    </div>
  </div>
</section>
