<div class="cm-app cm-popup-page">
  <div class="cm-toolbar">
    <div>
      <h3>Select Classroom</h3>
      <div class="cm-muted">Choose the room that belongs to this timetable slot.</div>
    </div>
    <div class="cm-inline-actions">
      <button class="btn btn-default btn-xs" v-on:click="searchRooms"><span class="glyphicon glyphicon-refresh"></span> Refresh</button>
    </div>
  </div>

  <div class="cm-panel">
    <div class="cm-panel-body">
      <div class="cm-profile-picker">
        <input class="form-control" v-model="search" placeholder="Search by code, name, or location" v-on:keyup.enter="searchRooms">
        <button class="btn btn-default" v-on:click="searchRooms"><span class="glyphicon glyphicon-search"></span> Search</button>
      </div>
    </div>
    <div class="cm-table">
      <table>
        <thead>
          <tr>
            <th>Code</th>
            <th>Name</th>
            <th>Capacity</th>
            <th>Status</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          <tr v-for="room in rooms">
            <td>{{ room.code }}</td>
            <td>
              <strong>{{ room.name }}</strong>
              <div class="cm-muted">{{ roomMeta(room) }}</div>
            </td>
            <td>{{ room.capacity || 0 }}</td>
            <td><span v-bind:class="roomBadgeClass(room.status)">{{ room.status }}</span></td>
            <td><button class="btn btn-primary btn-xs" v-on:click="selectRoom(room)">Select</button></td>
          </tr>
          <tr v-if="rooms.length == 0">
            <td colspan="5">{{ message }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
