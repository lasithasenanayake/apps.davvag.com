<section class="cm-page">
  <div class="cm-toolbar">
    <div>
      <h3>Weekly Timetable</h3>
    </div>
    <div class="btn-group">
      <button class="btn btn-default" v-on:click="refresh" title="Refresh"><span class="glyphicon glyphicon-refresh"></span></button>
      <button class="btn btn-default" v-on:click="navigate('../timetable')"><span class="glyphicon glyphicon-calendar"></span> Slots</button>
      <button class="btn btn-primary" v-on:click="openAttendanceForSelection"><span class="glyphicon glyphicon-ok"></span> Attendance</button>
    </div>
  </div>

  <div class="cm-alerts">
    <div class="alert alert-danger" v-for="error in errors">{{ error }}</div>
    <div class="alert alert-info" v-for="message in info">{{ message }}</div>
  </div>

  <div class="cm-panel">
    <div class="cm-panel-header">
      <strong>Week</strong>
      <div class="cm-inline-actions">
        <button class="btn btn-xs btn-default" v-on:click="previousWeek">&lt;</button>
        <button class="btn btn-xs btn-default" v-on:click="nextWeek">&gt;</button>
      </div>
    </div>
    <div class="cm-panel-body">
      <div class="cm-filter-strip">
        <label>Cohort<select v-model="filters.class_grade_id"><option value="">All cohorts</option><option v-for="classGrade in classGrades" v-bind:value="classGrade.id">{{ classGrade.name }}</option></select></label>
        <label>Subject<select v-model="filters.subject_id"><option value="">All subjects</option><option v-for="subject in subjects" v-bind:value="subject.id">{{ subject.code }} - {{ subject.title }}</option></select></label>
        <label>Week Starts<input type="date" v-model="filters.week_start"></label>
        <button class="btn btn-primary" v-on:click="loadWeek"><span class="glyphicon glyphicon-search"></span> Load</button>
      </div>
    </div>
  </div>

  <div class="cm-panel">
    <div class="cm-panel-header">
      <strong>{{ week_start }} to {{ week_end }}</strong>
      <span class="cm-muted">{{ slots.length }} slots</span>
    </div>
    <div class="cm-week-board">
      <div class="cm-week-header-row">
        <div class="cm-week-corner">Time</div>
        <div class="cm-week-head" v-bind:class="dayClass(day)" v-for="day in weekdays">
          <strong>{{ day.label }}</strong>
          <span>{{ day.date }}</span>
        </div>
      </div>
      <div class="cm-week-row" v-for="time in timeRows">
        <div class="cm-time-cell">{{ timeLabel(time) }}</div>
        <div class="cm-day-cell" v-bind:class="dayClass(day)" v-for="day in weekdays">
          <button class="cm-slot-card" v-for="slot in slotsFor(day, time)" v-on:click="goAttendance(slot)" title="Open attendance">
            <strong class="cm-slot-card-title">{{ subjectTitle(slot.subject_id) }}</strong>
            <span>{{ classGradeName(slot.class_grade_id) }}</span>
            <span class="cm-slot-card-meta">{{ rangeLabel(slot) }}</span>
            <span v-bind:class="statusClass(slot.status)">{{ slot.status }}</span>
            <span class="cm-slot-link">Add Attendance</span>
          </button>
          <span class="cm-week-empty" v-if="slotsFor(day, time).length == 0"></span>
        </div>
      </div>
    </div>
  </div>
</section>
