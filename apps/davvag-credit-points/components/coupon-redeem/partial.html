<section class="cp-page"><div class="cp-shell" style="max-width:760px"><header class="cp-top"><div class="cp-brand"><div class="cp-logo">C</div><div><h2>Redeem coupon</h2><p>Codes are verified securely on the server</p></div></div><nav class="cp-nav"><button v-on:click="go('')">Wallet</button><button class="active">Redeem</button></nav></header><div class="cp-alert error" v-for="e in errors">{{e}}</div><div class="cp-alert info" v-for="m in info">{{m}}</div><div class="cp-card"><div class="cp-head"><h3>Enter your gift code</h3></div><div class="cp-body"><form class="cp-form" v-on:submit.prevent="redeem"><label>Coupon code<input class="cp-code" v-model="code" autocomplete="off" placeholder="DV-XXXXXXXX-XXXXXXXX"></label><button class="cp-btn cp-primary" v-bind:disabled="busy||!code.trim()">{{busy?'Redeeming…':'Redeem credits'}}</button></form><p class="cp-muted">For security, codes are never stored in plaintext and error messages do not reveal whether a code exists.</p></div></div></div></section>
