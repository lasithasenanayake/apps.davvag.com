<section class="cp-page"><div class="cp-shell"><header class="cp-top"><div class="cp-brand"><div class="cp-logo">C</div><div><h2>Rewards</h2><p>Claim server-validated periodic rewards</p></div></div><nav class="cp-nav"><button v-on:click="go('')">Wallet</button><button class="active">Rewards</button><button v-on:click="go('redeem')">Redeem</button></nav></header><div class="cp-alert error" v-for="e in errors">{{e}}</div><div class="cp-alert info" v-for="m in info">{{m}}</div><div class="cp-grid cp-grid-3"><article class="cp-card" v-for="r in rules"><div class="cp-body"><span class="cp-badge">{{r.cadence}}</span><h3>{{r.title}}</h3><div class="cp-balance" style="font-size:30px;color:#126a58">+{{r.credit_amount}}</div><p class="cp-muted">Period {{r.period_key}}<span v-if="r.expiry_days"> · expires after {{r.expiry_days}} days</span></p><button class="cp-btn cp-primary" v-on:click="claim(r)" v-bind:disabled="r.claimed||busy">{{r.claimed?'Claimed':(busy===r.id?'Claiming…':'Claim reward')}}</button></div></article></div><div class="cp-empty cp-card" v-if="!rules.length">No active rewards are configured.</div></div></section>
