<section class="ie-app"><header class="ie-page-header"><div><p class="ie-kicker">Administration</p><h1>Template manager</h1><p>Create a template draft from one of your saved projects, then publish an immutable revision.</p></div></header><div class="ie-alert ie-alert-error" v-if="error">{{error}}</div><section class="ie-panel"><div class="ie-section-heading"><h2>Create template draft</h2></div><form class="ie-form-grid" v-on:submit.prevent="createDraft"><label class="ie-field">Source project<select v-model.number="form.projectId" required><option disabled value="0">Choose project</option><option v-for="p in projects" :value="p.id">{{p.title}}</option></select></label><label class="ie-field">Template title<input v-model.trim="form.title" maxlength="255" required></label><label class="ie-field">Category<input v-model.trim="form.category" maxlength="80"></label><button class="ie-btn ie-btn-primary" type="submit" :disabled="busy">Create draft</button></form></section><section class="ie-panel"><h2>Templates</h2><div class="ie-table-wrap"><table class="ie-table"><thead><tr><th>Title</th><th>Category</th><th>Status</th><th>Actions</th></tr></thead><tbody><tr v-for="item in templates"><td>{{item.title}}</td><td>{{item.category}}</td><td><span class="ie-badge">{{item.status}}</span></td><td><button class="ie-link-btn" v-if="item.status!=='published'" v-on:click="publish(item)">Publish</button> <button class="ie-link-btn" v-if="item.status==='published'" v-on:click="unpublish(item)">Unpublish</button> <button class="ie-link-btn ie-danger" v-on:click="archive(item)">Archive</button></td></tr></tbody></table></div></section></section>
