<section class="ie-app">
  <header class="ie-page-header">
    <div><p class="ie-kicker">Start faster</p><h1>Templates</h1><p>Use a published tenant template as a new independent design.</p></div>
    <button class="ie-btn ie-btn-secondary" type="button" v-on:click="goBack">My designs</button>
  </header>
  <div class="ie-alert ie-alert-error" v-if="error">{{error}}</div>
  <section class="ie-panel">
    <div class="ie-filter-row"><input v-model.trim="search" type="search" placeholder="Search templates"><button class="ie-btn ie-btn-secondary" v-on:click="load" :disabled="loading">Refresh</button></div>
    <div class="ie-loading" v-if="loading">Loading templates...</div>
    <template v-else>
      <div class="ie-empty" v-if="filtered.length===0"><strong>No published templates yet.</strong></div>
      <div class="ie-project-grid" v-else>
        <article class="ie-project-card" v-for="item in filtered" :key="item.id">
          <button class="ie-project-preview" type="button" v-on:click="useTemplate(item)"><img v-if="item.preview_media_reference" :src="item.preview_media_reference" alt=""><span v-else :style="{aspectRatio:item.width_px+'/'+item.height_px}">{{item.width_px}} x {{item.height_px}}</span></button>
          <div class="ie-project-meta"><h3>{{item.title}}</h3><p>{{item.category||'General'}}</p></div>
          <div class="ie-card-actions"><button class="ie-link-btn" v-on:click="useTemplate(item)" :disabled="busy">Use template</button></div>
        </article>
      </div>
    </template>
  </section>
</section>
