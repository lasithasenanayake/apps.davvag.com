<link href="assets/productapp/productapp.css" rel="stylesheet" type="text/css"/>

<div class="productapp-shell">
    <div class="productapp-panel">
        <div class="productapp-panel-header">
            <h3>Publish Product</h3>
            <p>Prepare marketplace details, availability, and delivery coverage before sending this product to the store.</p>
        </div>

        <div class="productapp-panel-body">
            <div v-if="submitErrors">
                <p v-for="error in submitErrors" class="alert alert-danger">{{ error }}</p>
            </div>

            <div class="productapp-section">
                <h4 class="productapp-section-title">Marketplace Details</h4>
                <div class="productapp-form-grid">
                    <div class="productapp-field">
                        <label>Web Store Domain</label>
                        <input type="text" v-model="product.tenant" disabled="disabled">
                    </div>
                    <div class="productapp-field">
                        <label>Marketplace Item ID</label>
                        <input type="number" v-model="product.itemid" disabled="disabled">
                    </div>
                    <div class="productapp-field">
                        <label>Local Item ID</label>
                        <input type="number" v-model="product.tid" disabled="disabled">
                    </div>
                    <div class="productapp-field">
                        <label>Product Name</label>
                        <input type="text" v-model="product.name">
                    </div>
                    <div class="productapp-field productapp-field-wide">
                        <label>Product Caption</label>
                        <textarea v-model="product.caption"></textarea>
                    </div>
                    <div class="productapp-field productapp-field-wide">
                        <label>Keywords</label>
                        <textarea v-model="product.keywords"></textarea>
                    </div>
                    <div class="productapp-field">
                        <label>Unit of Measure</label>
                        <select v-model="product.uom">
                            <option value="">Select UOM</option>
                            <option v-for="uom in uoms" v-bind:value="uom">{{uom}}</option>
                        </select>
                    </div>
                    <div class="productapp-field">
                        <label>Currency</label>
<select v-model="product.currencycode">
                          <option value="">Select configured currency</option>
                          <option v-for="currency in currencies" v-bind:value="currency.code">{{ currency.code }} — {{ currency.name }}</option>
                        </select>
                    </div>
                    <div class="productapp-field">
                        <label>Price</label>
                        <input type="number" v-model="product.price" min="0" step="0.01">
                    </div>
                    <div class="productapp-field">
                        <label>Quantity</label>
                        <input type="number" v-model="product.qty" min="0" step="1">
                    </div>
                    <div class="productapp-field">
                        <label>Discount %</label>
                        <input type="number" v-model="product.discountper" min="0" step="0.01">
                    </div>
                    <div class="productapp-field">
                        <label>Category</label>
                        <select v-model="product.catogory">
                            <option value="">Select category</option>
                            <option v-for="category in categories" v-bind:value="category">{{category}}</option>
                        </select>
                    </div>
                    <div class="productapp-field">
                        <label>Latitude</label>
                        <input type="text" v-model="product.lat">
                    </div>
                    <div class="productapp-field">
                        <label>Longitude</label>
                        <input type="text" v-model="product.lon">
                    </div>
                    <div class="productapp-field">
                        <label>Delivery Range (Km)</label>
                        <input type="number" v-model="product.deliveryrangekm" min="0" step="0.1">
                    </div>
                </div>
            </div>

            <div class="productapp-section">
                <h4 class="productapp-section-title">Availability</h4>
                <div class="productapp-days">
                    <label class="productapp-day"><span>Monday</span><input type="checkbox" true-value="Y" false-value="N" v-model="product.monday"></label>
                    <label class="productapp-day"><span>Tuesday</span><input type="checkbox" true-value="Y" false-value="N" v-model="product.tuesday"></label>
                    <label class="productapp-day"><span>Wednesday</span><input type="checkbox" true-value="Y" false-value="N" v-model="product.wednesday"></label>
                    <label class="productapp-day"><span>Thursday</span><input type="checkbox" true-value="Y" false-value="N" v-model="product.thursday"></label>
                    <label class="productapp-day"><span>Friday</span><input type="checkbox" true-value="Y" false-value="N" v-model="product.friday"></label>
                    <label class="productapp-day"><span>Saturday</span><input type="checkbox" true-value="Y" false-value="N" v-model="product.saturday"></label>
                    <label class="productapp-day"><span>Sunday</span><input type="checkbox" true-value="Y" false-value="N" v-model="product.sunday"></label>
                </div>
                <div class="productapp-form-grid" style="margin-top:16px;">
                    <div class="productapp-field">
                        <label>Available From</label>
                        <select v-model="product.timeFrom">
                            <option v-for="time in timeOptions" :value="time">{{ time }}</option>
                        </select>
                    </div>
                    <div class="productapp-field">
                        <label>Available To</label>
                        <select v-model="product.timeTo">
                            <option v-for="time in timeOptions" :value="time">{{ time }}</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="productapp-section">
                <h4 class="productapp-section-title">Image Preview</h4>
                <div class="productapp-preview">
                    <img v-if="image" :src="image" alt="Product image">
                    <span v-else>No product image selected yet.</span>
                </div>
            </div>

            <div id="AttributeText" style="display:none;"></div>
        </div>

        <div class="productapp-footer">
            <button class="productapp-btn productapp-btn-secondary" type="button" v-on:click="navigateBack">Cancel</button>
            <button id="send" class="productapp-btn productapp-btn-primary" type="button" v-on:click="submit">Publish To Market</button>
        </div>
    </div>
</div>
