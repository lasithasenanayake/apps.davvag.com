<link href="assets/productapp/productapp.css" rel="stylesheet" type="text/css"/>
<script src="assets/productapp/editor.js"></script>
<link href="assets/productapp/editor.css" type="text/css" rel="stylesheet"/>

<div class="productapp-shell">
    <div class="productapp-panel">
        <div class="productapp-panel-header">
            <h3>{{ product.itemid ? 'Edit Product' : 'Create Product' }}</h3>
            <p>Keep catalog details, pricing, imagery, and attributes together in one cleaner form.</p>
        </div>

        <div class="productapp-panel-body">
            <div v-if="submitErrors">
                <p v-for="error in submitErrors" class="alert alert-danger">{{ error }}</p>
            </div>

            <div class="productapp-section">
                <h4 class="productapp-section-title">Core Information</h4>
                <div class="productapp-form-grid">
                    <div class="productapp-field">
                        <label>Item ID</label>
                        <input type="number" v-model="product.itemid" disabled="disabled">
                    </div>
                    <div class="productapp-field">
                        <label>Product Name</label>
                        <input type="text" v-model="product.name" placeholder="Enter product name">
                    </div>
                    <div class="productapp-field productapp-field-wide">
                        <label>Product Caption</label>
                        <textarea id="txtcaption"></textarea>
                    </div>
                    <div class="productapp-field productapp-field-wide">
                        <label>Keywords</label>
                        <textarea v-model="product.keywords" placeholder="Comma-separated keywords help search and reuse"></textarea>
                    </div>
                    <div class="productapp-field">
                        <label>Unit of Measure</label>
                        <select v-model="product.uom">
                            <option value="">Select UOM</option>
                            <option v-for="uom in uoms" v-bind:value="uom">{{uom}}</option>
                        </select>
                    </div>
                    <div class="productapp-field">
                        <label>Type</label>
                        <select v-model="product.invType">
                            <option value="">Select type</option>
                            <option>Service</option>
                            <option>Inventory</option>
                            <option>Other</option>
                        </select>
                    </div>
                    <div class="productapp-field">
                        <label>Currency</label>
                        <select v-model="product.currencycode">
                            <option value="">Select currency</option>
                            <option>Rs.</option>
                            <option>USD</option>
                            <option>CHF</option>
                        </select>
                    </div>
                    <div class="productapp-field">
                        <label>Cost</label>
                        <input type="number" v-model="product.cost" min="0" step="0.01">
                    </div>
                    <div class="productapp-field">
                        <label>Price</label>
                        <input type="number" v-model="product.price" min="0" step="0.01">
                    </div>
                    <div class="productapp-field">
                        <label>Discount %</label>
                        <input type="number" v-model="product.discountper" min="0" step="0.01">
                    </div>
                    <div class="productapp-field">
                        <label>Category</label>
                        <select v-model="product.catogory">
                            <option value="">Select category</option>
                            <option v-for="category in categories" v-bind:value="category">{{category}}</option>
                        </select>
                    </div>
                    <div class="productapp-field">
                        <label>Show On Store</label>
                        <select v-model="product.showonstore">
                            <option value="Y">Yes</option>
                            <option value="N">No</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="productapp-section">
                <h4 class="productapp-section-title">Product Preview</h4>
                <div class="productapp-preview">
                    <img v-if="image" :src="image" alt="Product preview">
                    <span v-else>No default image selected yet.</span>
                </div>
            </div>

            <div class="productapp-section">
                <h4 class="productapp-section-title">Attributes</h4>
                <form class="form-horizontal" id="AttributeText"></form>
            </div>

            <div class="productapp-section">
                <h4 class="productapp-section-title">Images & Documents</h4>
                <div class="productapp-field productapp-field-wide">
                    <label>Upload Files</label>
                    <input type="file" multiple="" @change="onFileMultiChange">
                </div>

                <div class="productapp-image-grid" v-if="p_image.length">
                    <div class="productapp-image-card" v-for="(image,index) in p_image" :key="image.id + '-' + index">
                        <img :src="image.scr" :alt="image.name">
                        <div class="productapp-image-body">
                            <div class="productapp-field">
                                <label>Image Reference</label>
                                <input type="text" :value="'![alt text](components/dock/soss-uploader/service/get/products/' + product.itemid + '-' + image.name + ')'" readonly>
                            </div>
                            <div class="productapp-field">
                                <label>Caption</label>
                                <textarea v-model="image.caption"></textarea>
                            </div>
                            <div class="productapp-inline">
                                <label class="radio-inline">
                                    <input type="radio" name="product-default-image" v-model="product.imgurl" :value="image.name">
                                    Default image
                                </label>
                                <button class="productapp-btn productapp-btn-danger" type="button" @click="removeImage(index)">Remove</button>
                            </div>
                        </div>
                    </div>
                </div>
                <div v-else class="productapp-empty">
                    <p>No gallery images uploaded yet.</p>
                </div>
            </div>
        </div>

        <div class="productapp-footer">
            <button class="productapp-btn productapp-btn-secondary" type="button" v-on:click="navigateBack">Cancel</button>
            <button id="send" class="productapp-btn productapp-btn-primary" type="button" v-on:click="submit">Save Product</button>
        </div>
    </div>
</div>
