<div class="product-v2-app product-edit panel panel-default">
  <div class="panel-heading">
    <div class="panel-btns">
      <a v-on:click="navigateBack()" class="panel-close">&times;</a>
    </div>
    <div class="product-form-title">
      <h3><i class="fa fa-upload"></i> Publish Product</h3>
      <p>Prepare product details, delivery availability, and images for the market.</p>
    </div>
    <p v-if="submitErrors" v-for="error in submitErrors" class="alert alert-danger">{{ error }}</p>
  </div>

  <div class="panel-body panel-body-nopadding">
    <ul class="nav nav-tabs">
      <li class="active"><a href="#settings-users" data-toggle="tab"><strong>Information</strong></a></li>
      <li><a href="#settings-apps" data-toggle="tab"><strong>Delivery Available Time & Dates</strong></a></li>
      <li><a href="#settings-logo-title" data-toggle="tab"><strong>Images & Documents</strong></a></li>
    </ul>

    <div class="tab-content mb30">
      <div class="tab-pane active product-step" id="settings-users">
        <form class="form-horizontal form-bordered" onsubmit="event.preventDefault();">
          <div class="form-group">
            <label class="col-sm-3 control-label">Web Store Domain</label>
            <div class="col-sm-6">
              <input type="number" class="form-control" v-model="product.tenant" disabled="disabled">
            </div>
          </div>
          <div class="form-group">
            <label class="col-sm-3 control-label">Item ID</label>
            <div class="col-sm-6">
              <input type="number" class="form-control" v-model="product.itemid" disabled="disabled">
            </div>
          </div>
          <div class="form-group">
            <label class="col-sm-3 control-label">Our Item ID</label>
            <div class="col-sm-6">
              <input type="number" class="form-control" v-model="product.tid" disabled="disabled">
            </div>
          </div>
          <div class="form-group">
            <label class="col-sm-3 control-label">Product Name</label>
            <div class="col-sm-6">
              <input type="text" class="form-control" v-model="product.name">
            </div>
          </div>
          <div class="form-group">
            <label class="col-sm-3 control-label">Product Caption</label>
            <div class="col-sm-6">
              <textarea class="form-control" v-model="product.caption" rows="5"></textarea>
            </div>
          </div>
          <div class="form-group">
            <label class="col-sm-3 control-label">Keywords</label>
            <div class="col-sm-6">
              <textarea class="form-control" v-model="product.keywords" rows="5"></textarea>
            </div>
          </div>
          <div class="form-group">
            <label class="col-sm-3 control-label">Unit of Measure</label>
            <div class="col-sm-6">
              <select class="form-control" v-model="product.uom">
                <option v-for="uom in uoms" v-bind:value="uom">{{ uom }}</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label class="col-sm-3 control-label">Currency</label>
            <div class="col-sm-6">
<select class="form-control" v-model="product.currencycode">
                <option value="">Select configured currency</option>
                <option v-for="currency in currencies" v-bind:value="currency.code">{{ currency.code }} — {{ currency.name }}</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label class="col-sm-3 control-label">Product Price</label>
            <div class="col-sm-6">
              <input type="number" class="form-control" v-model="product.price">
            </div>
          </div>
          <div class="form-group">
            <label class="col-sm-3 control-label">Quantity</label>
            <div class="col-sm-6">
              <input type="number" class="form-control" v-model="product.qty">
            </div>
          </div>
          <div class="form-group">
            <label class="col-sm-3 control-label">Discount</label>
            <div class="col-sm-6">
              <input type="number" class="form-control" v-model="product.discountper">
            </div>
          </div>
          <div class="form-group">
            <label class="col-sm-3 control-label">Product Category</label>
            <div class="col-sm-6">
              <select class="form-control" v-model="product.catogory">
                <option v-for="category in categories" v-bind:value="category">{{ category }}</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label class="col-sm-3 control-label">Product Image</label>
            <div class="col-sm-6">
              <img v-if="image" v-bind:src="image" class="product-image-preview">
            </div>
          </div>
          <div class="form-group">
            <label class="col-sm-3 control-label">Latitude</label>
            <div class="col-sm-6">
              <input type="text" class="form-control" v-model="product.lat">
            </div>
          </div>
          <div class="form-group">
            <label class="col-sm-3 control-label">Longitude</label>
            <div class="col-sm-6">
              <input type="text" class="form-control" v-model="product.lon">
            </div>
          </div>
          <div class="form-group">
            <label class="col-sm-3 control-label">Delivery Range</label>
            <div class="col-sm-6">
              <input type="number" class="form-control" v-model="product.deliveryrangekm">
            </div>
          </div>
        </form>
      </div>

      <div class="tab-pane product-step" id="settings-apps">
        <form class="form-horizontal form-bordered" onsubmit="event.preventDefault();">
          <div class="form-group">
            <label class="col-sm-3 control-label">Monday</label>
            <div class="col-sm-6">
              <input type="checkbox" true-value="Y" false-value="N" v-model="product.monday">
            </div>
          </div>
          <div class="form-group">
            <label class="col-sm-3 control-label">Tuesday</label>
            <div class="col-sm-6">
              <input type="checkbox" true-value="Y" false-value="N" v-model="product.tuesday">
            </div>
          </div>
          <div class="form-group">
            <label class="col-sm-3 control-label">Wednesday</label>
            <div class="col-sm-6">
              <input type="checkbox" true-value="Y" false-value="N" v-model="product.wednesday">
            </div>
          </div>
          <div class="form-group">
            <label class="col-sm-3 control-label">Thursday</label>
            <div class="col-sm-6">
              <input type="checkbox" true-value="Y" false-value="N" v-model="product.thursday">
            </div>
          </div>
          <div class="form-group">
            <label class="col-sm-3 control-label">Friday</label>
            <div class="col-sm-6">
              <input type="checkbox" true-value="Y" false-value="N" v-model="product.friday">
            </div>
          </div>
          <div class="form-group">
            <label class="col-sm-3 control-label">Saturday</label>
            <div class="col-sm-6">
              <input type="checkbox" true-value="Y" false-value="N" v-model="product.saturday">
            </div>
          </div>
          <div class="form-group">
            <label class="col-sm-3 control-label">Sunday</label>
            <div class="col-sm-6">
              <input type="checkbox" true-value="Y" false-value="N" v-model="product.sunday">
            </div>
          </div>
          <div class="form-group">
            <label class="col-sm-3 control-label">Available From</label>
            <div class="col-sm-6">
              <select class="form-control" v-model="product.timeFrom">
                <option>7:00 AM</option>
                <option>8:00 AM</option>
                <option>9:00 AM</option>
                <option>10:00 AM</option>
                <option>11:00 AM</option>
                <option>12:00 PM</option>
                <option>1:00 PM</option>
                <option>2:00 PM</option>
                <option>3:00 PM</option>
                <option>4:00 PM</option>
                <option>5:00 PM</option>
                <option>6:00 PM</option>
                <option>7:00 PM</option>
                <option>9:00 PM</option>
                <option>10:00 PM</option>
                <option>11:00 PM</option>
                <option>12:00 AM</option>
                <option>1:00 AM</option>
                <option>2:00 AM</option>
                <option>3:00 AM</option>
                <option>4:00 AM</option>
                <option>5:00 AM</option>
                <option>6:00 AM</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label class="col-sm-3 control-label">Available To</label>
            <div class="col-sm-6">
              <select class="form-control" v-model="product.timeTo">
                <option>7:00 AM</option>
                <option>8:00 AM</option>
                <option>9:00 AM</option>
                <option>10:00 AM</option>
                <option>11:00 AM</option>
                <option>12:00 PM</option>
                <option>1:00 PM</option>
                <option>2:00 PM</option>
                <option>3:00 PM</option>
                <option>4:00 PM</option>
                <option>5:00 PM</option>
                <option>6:00 PM</option>
                <option>7:00 PM</option>
                <option>9:00 PM</option>
                <option>10:00 PM</option>
                <option>11:00 PM</option>
                <option>12:00 AM</option>
                <option>1:00 AM</option>
                <option>2:00 AM</option>
                <option>3:00 AM</option>
                <option>4:00 AM</option>
                <option>5:00 AM</option>
                <option>6:00 AM</option>
              </select>
            </div>
          </div>
        </form>
      </div>

      <div class="tab-pane product-step" id="settings-logo-title">
        <div class="form-group">
          <div class="form-group files">
            <label>Upload Your File</label>
            <input type="file" class="form-control" multiple="" v-on:change="onFileMultiChange">
          </div>
          <div class="product-image-grid">
            <div v-for="(image,index) in p_image">
              <figure class="imghvr-fade">
                <img v-bind:src="image.scr" class="img-responsive product-image-preview">
                <figcaption>
                  <div class="form-group">
                    <label>SNAP CODE</label>
                    <input type="text" class="form-control" v-bind:value="'![alt text](components/dock/soss-uploader/service/get/products/'+product.itemid+'-'+image.name+')'">
                  </div>
                  <div class="form-group">
                    <label>Caption</label>
                    <textarea class="form-control" v-model="image.caption"></textarea>
                  </div>
                  <label class="radio-inline">
                    <input type="radio" name="default_product_image" v-model="product.imgurl" v-bind:value="image.name">
                    Default Image
                  </label>
                  <div class="btn-group">
                    <button type="button" v-on:click="removeImage(index)" class="btn btn-default">Remove image</button>
                  </div>
                </figcaption>
              </figure>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="panel-footer">
    <div class="product-form-actions">
      <button id="send" type="button" class="btn btn-primary" v-on:click="submit">Publish To Market</button>
      <button type="button" class="btn btn-default" v-on:click="navigateBack">Cancel</button>
    </div>
  </div>
</div>
