<div class="product-v2-app document-list-page">
  <div class="product-list-header">
    <div class="product-list-title">
      <h3><i v-bind:class="'fa ' + icon"></i> {{ title }}</h3>
      <p>{{ subtitle }}</p>
    </div>
    <div class="product-actions">
      <button class="btn btn-default" v-on:click="refresh" v-bind:disabled="loading"><i class="fa fa-refresh"></i> Refresh</button>
      <button class="btn btn-primary" v-on:click="createRecord"><i class="fa fa-plus"></i> New {{ type == 'grn' ? 'GRN' : 'PO' }}</button>
      <button class="btn btn-primary" v-on:click="goInventory"><i class="fa fa-archive"></i> Inventory</button>
    </div>
  </div>

  <div class="product-toolbar document-toolbar">
    <select class="form-control" v-model="SearchColumn" v-on:change="applyFilter">
      <option value="all">All fields</option>
      <option value="tranNo">Document No</option>
      <option value="profileId">Supplier ID</option>
      <option value="name">Supplier</option>
      <option value="status">Status</option>
      <option value="Complete">Complete</option>
    </select>
    <input class="form-control" type="text" placeholder="Search documents..." v-model="SearchItem" v-on:input="applyFilter">
    <button class="btn btn-default" v-on:click="clearSearch"><i class="fa fa-times"></i> Clear</button>
  </div>

  <div class="product-summary">
    <i v-bind:class="loading ? 'fa fa-spinner fa-spin' : 'fa fa-info-circle'"></i>
    <span>{{ Message }}</span>
  </div>

  <div class="alert alert-danger" v-for="error in errors">{{ error }}</div>

  <div class="product-table-wrap">
    <table class="table table-bordered product-table">
      <thead>
        <tr>
          <th style="width: 120px;">No</th>
          <th style="width: 150px;">Date</th>
          <th>Supplier</th>
          <th style="width: 120px;">Status</th>
          <th style="width: 120px;">Complete</th>
          <th style="width: 140px;" class="text-right">Total</th>
          <th style="width: 120px;" class="text-right">Lines</th>
          <th style="width: 170px;" class="text-right">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr v-show="loading">
          <td colspan="8" class="product-empty-state">Loading {{ title.toLowerCase() }}...</td>
        </tr>
        <tr v-show="!loading && records.length === 0">
          <td colspan="8" class="product-empty-state">No {{ title.toLowerCase() }} found.</td>
        </tr>
        <template v-for="record in records">
          <tr>
            <td><strong>#{{ record.tranNo }}</strong></td>
            <td>{{ record.tranDate || record.invoiceDate || '-' }}</td>
            <td>
              <div class="product-name">{{ record.name || 'No supplier' }}</div>
              <div class="product-muted">Profile #{{ record.profileId || '-' }} {{ record.email || '' }}</div>
            </td>
            <td><span class="label label-default">{{ record.status || '-' }}</span></td>
            <td><span v-bind:class="record.Complete == 'Y' ? 'label label-success' : 'label label-warning'">{{ record.Complete == 'Y' ? 'Yes' : 'No' }}</span></td>
            <td class="text-right">{{ formatMoney(record.total) }}</td>
            <td class="text-right">
              <button class="btn btn-default btn-sm" v-on:click="toggleDetails(record)">
                <i v-bind:class="record._open ? 'fa fa-chevron-up' : 'fa fa-chevron-down'"></i> {{ (record.InvoiceItems || []).length }}
              </button>
            </td>
            <td class="text-right">
              <div class="product-row-actions">
                <button class="btn btn-default btn-sm" v-on:click="viewRecord(record)"><i class="fa fa-eye"></i> View</button>
                <button class="btn btn-primary btn-sm" v-on:click="editRecord(record)"><i class="fa fa-pencil"></i> Edit</button>
                <button class="btn btn-warning btn-sm" v-on:click="cancelRecord(record)" v-bind:disabled="isCancelled(record)"><i class="fa fa-ban"></i> Cancel</button>
              </div>
            </td>
          </tr>
          <tr v-show="record._open">
            <td colspan="8" class="document-detail-cell">
              <table class="table table-bordered document-lines-table">
                <thead>
                  <tr>
                    <th>Product</th>
                    <th style="width: 100px;">UOM</th>
                    <th style="width: 120px;" class="text-right">Qty</th>
                    <th style="width: 140px;" class="text-right">Price</th>
                    <th style="width: 140px;" class="text-right">Total</th>
                  </tr>
                </thead>
                <tbody>
                  <tr v-show="!record.InvoiceItems || record.InvoiceItems.length === 0">
                    <td colspan="5" class="product-empty-state">No line items.</td>
                  </tr>
                  <tr v-for="line in record.InvoiceItems">
                    <td>#{{ line.itemid }} {{ line.name }}</td>
                    <td>{{ line.uom || '-' }}</td>
                    <td class="text-right">{{ number(line.qty) }}</td>
                    <td class="text-right">{{ formatMoney(line.price) }}</td>
                    <td class="text-right">{{ formatMoney(line.total) }}</td>
                  </tr>
                </tbody>
              </table>
            </td>
          </tr>
        </template>
      </tbody>
    </table>
  </div>
</div>
