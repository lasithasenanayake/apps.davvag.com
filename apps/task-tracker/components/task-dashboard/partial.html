<section class="tm-app">
  <div class="tm-toolbar">
    <div>
      <h3>Task Manager</h3>
      <span class="text-muted" v-if="selectedProject">{{ selectedProject.name }}</span>
    </div>
    <div class="btn-group">
      <button class="btn btn-default" v-on:click="refresh"><span class="glyphicon glyphicon-refresh"></span></button>
      <button class="btn btn-primary" v-on:click="newProject"><span class="glyphicon glyphicon-plus"></span> Project</button>
      <button class="btn btn-success" v-on:click="newTask" v-bind:disabled="!selectedProject"><span class="glyphicon glyphicon-plus"></span> Task</button>
    </div>
  </div>

  <div class="alert alert-danger" v-for="error in errors">{{ error }}</div>
  <div class="alert alert-info" v-for="message in info">{{ message }}</div>

  <div class="row tm-grid">
    <div class="col-sm-4 col-md-3 tm-column">
      <div class="tm-panel">
        <div class="tm-panel-header">
          <strong>Projects</strong>
        </div>
        <div class="tm-list">
          <button class="tm-list-item" v-for="project in projects" v-on:click="selectProject(project)" v-bind:class="{active:selectedProject && selectedProject.projectId == project.projectId}">
            <span>{{ project.name }}</span>
            <small>{{ project.status }}</small>
          </button>
        </div>
      </div>

      <div class="tm-panel tm-form">
        <div class="tm-panel-header">
          <strong>Project</strong>
          <button class="btn btn-xs btn-default" v-on:click="ChangePermision(projectForm)"><span class="glyphicon glyphicon-lock"></span></button>
        </div>
        <label>Name</label>
        <input class="form-control" v-model="projectForm.name">
        <label>Description</label>
        <textarea class="form-control" rows="3" v-model="projectForm.description"></textarea>
        <label>Status</label>
        <select class="form-control" v-model="projectForm.status">
          <option>Active</option>
          <option>Paused</option>
          <option>Closed</option>
        </select>

        <ul class="nav nav-tabs tm-tabs">
          <li class="active"><a href="#tm-access" data-toggle="tab">Access</a></li>
          <li><a href="#tm-mail" data-toggle="tab">Mail</a></li>
        </ul>
        <div class="tab-content">
          <div class="tab-pane active" id="tm-access">
            <label class="tm-check" v-for="profile in profiles">
              <input type="checkbox" v-bind:checked="hasProjectProfile(profile)" v-on:change="toggleProjectProfile(profile)">
              <span>{{ profile.name }}</span>
            </label>
          </div>
          <div class="tab-pane" id="tm-mail">
            <div class="row">
              <div class="col-xs-8"><label>SMTP host</label><input class="form-control" v-model="projectForm.smtpHost"></div>
              <div class="col-xs-4"><label>Port</label><input class="form-control" v-model="projectForm.smtpPort"></div>
              <div class="col-xs-6"><label>User</label><input class="form-control" v-model="projectForm.smtpUser"></div>
              <div class="col-xs-6"><label>Password</label><input type="password" class="form-control" v-model="projectForm.smtpPassword"></div>
              <div class="col-xs-12"><label>From email</label><input class="form-control" v-model="projectForm.smtpFromEmail"></div>
              <div class="col-xs-8"><label>IMAP host</label><input class="form-control" v-model="projectForm.imapHost"></div>
              <div class="col-xs-4"><label>Port</label><input class="form-control" v-model="projectForm.imapPort"></div>
              <div class="col-xs-6"><label>User</label><input class="form-control" v-model="projectForm.imapUser"></div>
              <div class="col-xs-6"><label>Password</label><input type="password" class="form-control" v-model="projectForm.imapPassword"></div>
              <div class="col-xs-12"><label>Mailbox</label><input class="form-control" v-model="projectForm.imapMailbox"></div>
            </div>
          </div>
        </div>

        <div class="tm-actions">
          <button class="btn btn-primary" v-on:click="saveProject"><span class="glyphicon glyphicon-floppy-disk"></span> Save</button>
          <button class="btn btn-danger" v-on:click="deleteProject(projectForm)" v-if="projectForm.projectId"><span class="glyphicon glyphicon-trash"></span></button>
        </div>
      </div>
    </div>

    <div class="col-sm-8 col-md-4 tm-column">
      <div class="tm-panel">
        <div class="tm-panel-header">
          <strong>Tasks</strong>
          <select class="form-control input-sm tm-status-filter" v-model="filters.taskStatus" v-on:change="loadTasks">
            <option value="">All</option>
            <option v-for="status in statusOptions">{{ status }}</option>
          </select>
        </div>
        <div class="tm-list tm-task-list">
          <button class="tm-list-item tm-task-item" v-for="task in tasks" v-on:click="selectTask(task)" v-bind:class="{active:selectedTask && selectedTask.taskId == task.taskId}">
            <strong>{{ task.subject }}</strong>
            <span class="label label-default">{{ task.status }}</span>
            <div class="progress">
              <div class="progress-bar" v-bind:class="progressClass(task)" v-bind:style="{width:(task.progress || 0) + '%'}">{{ task.progress || 0 }}%</div>
            </div>
          </button>
        </div>
      </div>
    </div>

    <div class="col-sm-12 col-md-5 tm-column">
      <div class="tm-panel tm-form">
        <div class="tm-panel-header">
          <strong>Task</strong>
          <div class="btn-group">
            <button class="btn btn-xs btn-default" v-for="status in statusOptions" v-on:click="setTaskStatus(status)" v-bind:disabled="!taskForm.taskId">{{ status }}</button>
          </div>
        </div>

        <label>Subject</label>
        <input class="form-control" v-model="taskForm.subject">
        <label>Body</label>
        <textarea class="form-control" rows="5" v-model="taskForm.body"></textarea>
        <div class="row">
          <div class="col-xs-6"><label>Status</label><select class="form-control" v-model="taskForm.status"><option v-for="status in statusOptions">{{ status }}</option></select></div>
          <div class="col-xs-6"><label>Progress</label><input type="number" min="0" max="100" class="form-control" v-model="taskForm.progress"></div>
        </div>

        <label>Assignees</label>
        <div class="tm-chip-list">
          <button type="button" class="tm-chip" v-for="profile in profiles" v-bind:class="{active:isAssignee(profile)}" v-on:click="toggleAssignee(profile)">{{ profile.name }}</button>
        </div>

        <label>Attachments</label>
        <input type="file" class="form-control" multiple v-on:change="onFileChange">
        <div class="tm-attachments">
          <div class="tm-attachment" v-for="(file,index) in attachments">
            <a v-bind:href="attachmentUrl(file)" target="_blank">
              <img v-if="file.fileType && file.fileType.indexOf('image') === 0" v-bind:src="file.scr">
              <span v-if="!file.fileType || file.fileType.indexOf('image') !== 0" class="glyphicon glyphicon-paperclip"></span>
              {{ file.name }}
            </a>
            <input class="form-control input-sm" placeholder="Caption" v-model="file.caption">
            <button class="btn btn-xs btn-default" v-on:click="removeAttachment(index)"><span class="glyphicon glyphicon-remove"></span></button>
          </div>
        </div>

        <div class="tm-actions">
          <button class="btn btn-primary" v-on:click="saveTask"><span class="glyphicon glyphicon-floppy-disk"></span> Save Task</button>
          <button class="btn btn-danger" v-if="taskForm.taskId" v-on:click="deleteTask(taskForm)"><span class="glyphicon glyphicon-trash"></span></button>
        </div>
      </div>

      <div class="tm-panel tm-form" v-if="taskForm.taskId">
        <div class="tm-panel-header"><strong>Work Log</strong></div>
        <textarea class="form-control" rows="3" v-model="workLogForm.comments"></textarea>
        <div class="row">
          <div class="col-xs-4"><label>Minutes</label><input type="number" class="form-control" v-model="workLogForm.durationInMinutes"></div>
          <div class="col-xs-4"><label>Progress</label><input type="number" class="form-control" v-model="workLogForm.progress"></div>
          <div class="col-xs-4"><label>Status</label><select class="form-control" v-model="workLogForm.status"><option v-for="status in statusOptions">{{ status }}</option></select></div>
        </div>
        <button class="btn btn-success tm-log-button" v-on:click="addWorkLog"><span class="glyphicon glyphicon-time"></span> Add Log</button>
        <div class="tm-timeline">
          <div class="tm-log" v-for="log in workLogs">
            <strong>{{ log.status }} - {{ log.progress }}%</strong>
            <span class="text-muted">{{ log.durationInMinutes }} min</span>
            <p>{{ log.comments }}</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
