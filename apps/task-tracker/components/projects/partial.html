<section class="tm-page">
  <div class="tm-toolbar">
    <div>
      <h3>Projects</h3>
      <span class="text-muted">Create projects, assign access, and configure mail settings.</span>
    </div>
    <div class="btn-group">
      <button class="btn btn-default" v-on:click="refresh"><span class="glyphicon glyphicon-refresh"></span></button>
      <button class="btn btn-primary" v-on:click="createProject"><span class="glyphicon glyphicon-plus"></span> Project</button>
    </div>
  </div>

  <div class="alert alert-danger" v-for="error in errors">{{ error }}</div>
  <div class="alert alert-info" v-for="message in info">{{ message }}</div>

  <div class="row">
    <div class="col-md-5">
      <div class="tm-panel">
        <div class="tm-panel-header"><strong>Project List</strong></div>
        <div class="tm-list">
          <div class="tm-project-row" v-for="project in projects" v-bind:class="{active:selected && selected.projectId == project.projectId}">
            <button class="tm-list-main" v-on:click="selectProject(project)">
              <strong>{{ project.name }}</strong>
              <span>{{ project.status }}</span>
            </button>
            <button class="btn btn-xs btn-success" v-on:click="openTasks(project)"><span class="glyphicon glyphicon-tasks"></span></button>
          </div>
        </div>
      </div>
    </div>

    <div class="col-md-7">
      <div class="tm-panel tm-form">
        <div class="tm-panel-header">
          <strong>{{ form.projectId ? 'Edit Project' : 'New Project' }}</strong>
          <button class="btn btn-xs btn-default" v-on:click="ChangePermision(form)"><span class="glyphicon glyphicon-lock"></span></button>
        </div>

        <label>Project name</label>
        <input class="form-control" v-model="form.name">
        <label>Description</label>
        <textarea class="form-control" rows="3" v-model="form.description"></textarea>
        <label>Status</label>
        <select class="form-control" v-model="form.status">
          <option>Active</option>
          <option>Paused</option>
          <option>Closed</option>
        </select>

        <ul class="nav nav-tabs tm-tabs">
          <li class="active"><a href="#project-access" data-toggle="tab">Access</a></li>
          <li><a href="#project-mail" data-toggle="tab">SMTP / IMAP</a></li>
        </ul>
        <div class="tab-content">
          <div class="tab-pane active" id="project-access">
            <div class="tm-profile-grid">
              <label class="tm-check" v-for="profile in profiles">
                <input type="checkbox" v-bind:checked="hasProfile(profile)" v-on:change="toggleProfile(profile)">
                <span>{{ profile.name }}</span>
              </label>
            </div>
          </div>
          <div class="tab-pane" id="project-mail">
            <div class="row">
              <div class="col-sm-8"><label>SMTP host</label><input class="form-control" v-model="form.smtpHost"></div>
              <div class="col-sm-4"><label>Port</label><input class="form-control" v-model="form.smtpPort"></div>
              <div class="col-sm-6"><label>SMTP user</label><input class="form-control" v-model="form.smtpUser"></div>
              <div class="col-sm-6"><label>SMTP password</label><input type="password" class="form-control" v-model="form.smtpPassword"></div>
              <div class="col-sm-6"><label>SMTP secure</label><input class="form-control" v-model="form.smtpSecure"></div>
              <div class="col-sm-6"><label>From email</label><input class="form-control" v-model="form.smtpFromEmail"></div>
              <div class="col-sm-8"><label>IMAP host</label><input class="form-control" v-model="form.imapHost"></div>
              <div class="col-sm-4"><label>Port</label><input class="form-control" v-model="form.imapPort"></div>
              <div class="col-sm-6"><label>IMAP user</label><input class="form-control" v-model="form.imapUser"></div>
              <div class="col-sm-6"><label>IMAP password</label><input type="password" class="form-control" v-model="form.imapPassword"></div>
              <div class="col-sm-6"><label>IMAP secure</label><input class="form-control" v-model="form.imapSecure"></div>
              <div class="col-sm-6"><label>Mailbox</label><input class="form-control" v-model="form.imapMailbox"></div>
            </div>
          </div>
        </div>

        <div class="tm-actions">
          <button class="btn btn-primary" v-on:click="saveProject"><span class="glyphicon glyphicon-floppy-disk"></span> Save Project</button>
          <button class="btn btn-success" v-if="form.projectId" v-on:click="openTasks(form)"><span class="glyphicon glyphicon-tasks"></span> Tasks</button>
          <button class="btn btn-danger" v-if="form.projectId" v-on:click="deleteProject(form)"><span class="glyphicon glyphicon-trash"></span></button>
        </div>
      </div>
    </div>
  </div>
</section>
