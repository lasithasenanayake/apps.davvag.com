<section class="ytg-shell" v-bind:class="{'ytg-skeleton':loading}">
 <header class="ytg-header">
  <div><button class="ytg-button secondary" v-on:click="back">&#8592; Video library</button><h1 style="margin-top:14px">{{analysis&&analysis.video?analysis.video.title:"Video Inspector"}}</h1><p>Official video data, transcript intelligence, and evidence-linked competitor research.</p></div>
  <button class="ytg-button" v-on:click="syncVideo" v-bind:disabled="!!syncing">{{syncing?"Refreshing...":"Refresh video"}}</button>
 </header>
 <div class="ytg-alert error" v-if="error" style="white-space:pre-line"><div>{{error}}</div><div class="ytg-alert-actions" v-if="syncErrorActions(error).length"><a class="ytg-button secondary" v-for="action in syncErrorActions(error)" v-bind:href="action.url" target="_blank" rel="noopener noreferrer">{{action.label}}</a></div></div>
 <div class="ytg-alert" v-if="info">{{info}}</div>
 <template v-if="analysis">
  <div class="ytg-panel"><div class="ytg-channel-card"><img class="ytg-video" style="width:260px;max-width:40%;border-radius:9px" v-bind:src="analysis.video.thumbnailUrl" alt="" v-if="analysis.video.thumbnailUrl"><div><div class="ytg-badges"><span class="ytg-badge">{{analysis.video.contentType}}</span><span class="ytg-badge">{{analysis.video.privacyStatus}}</span><span class="ytg-badge">{{analysis.video.language||"Language not set"}}</span></div><p>{{analysis.video.description}}</p><small class="ytg-muted">Published {{formatDate(analysis.video.publishedAt)}} &middot; {{formatDuration(analysis.video.durationSeconds)}}</small></div></div></div>
  <div class="ytg-tabs" style="margin-top:16px"><button v-for="tab in ['overview','reach','retention','competitors','actions']" v-bind:class="{active:activeTab===tab}" v-on:click="setTab(tab)">{{tab}}</button></div>
  <div class="ytg-panel" v-if="activeTab==='overview'"><h2>Metric snapshots</h2><div class="ytg-table-wrap"><table class="ytg-table"><thead><tr><th>Captured</th><th>Source</th><th>Views</th><th>Watch minutes</th><th>Avg duration</th><th>Avg percentage</th></tr></thead><tbody><tr v-for="row in analysis.statistics"><td>{{formatDate(row.capturedAt)}}</td><td><span class="ytg-source-label">{{row.source}}</span></td><td>{{formatNumber(row.views)}}</td><td>{{formatWatchMinutes(row)}}</td><td>{{formatAverageDuration(row)}}</td><td>{{formatAveragePercentage(row)}}</td></tr></tbody></table></div></div>
  <div class="ytg-panel" v-if="activeTab==='reach'"><h2>Reach and traffic sources</h2><p class="ytg-muted">Reach rows are imported from documented YouTube Reporting API jobs. The current inspector exposes them through channel summaries; richer per-video visualizations remain deferred.</p></div>
  <div class="ytg-panel" v-if="activeTab==='retention'"><h2>Retention and transcript timeline</h2><div class="ytg-alert">{{analysis.phaseNotice}}</div><div class="ytg-retention-chart" v-if="analysis.retention.length"><span v-for="point in analysis.retention" v-bind:style="{height:Math.max(3,Math.min(100,Number(point.audienceWatchRatio||0)*100))+'%'}"></span></div><div class="ytg-empty" v-if="!analysis.retention.length">No official retention points have been imported for this video.</div><div v-if="analysis.transcript"><div class="ytg-badges"><span class="ytg-badge">{{analysis.transcript.sourceType}}</span><span class="ytg-badge">{{analysis.transcript.language}}</span><span class="ytg-badge">{{analysis.transcript.segments.length}} segments</span></div><p class="ytg-muted">{{analysis.transcript.provenance}}</p><div class="ytg-transcript-preview">{{analysis.transcript.plainText}}</div></div><div class="ytg-empty" v-if="!analysis.transcript">No transcript is stored. Import a user-provided transcript from Growth Studio.</div></div>

  <div v-if="activeTab==='competitors'">
   <div class="ytg-panel" style="margin-bottom:16px">
    <div class="ytg-panel-head"><div><h2>Competitor video research</h2><p class="ytg-muted">Add specific public videos to research their metadata, performance patterns, keywords, hashtags, and packaging.</p></div><span class="ytg-badge" v-if="competitor.workspace">{{competitor.workspace.videos.length}} sources</span></div>
    <label>Competitor YouTube video URLs<textarea rows="4" v-model="competitor.urls" placeholder="https://www.youtube.com/watch?v=...&#10;https://youtu.be/..."></textarea></label>
    <div class="ytg-actions" style="margin-top:10px"><button class="ytg-button" v-on:click="addCompetitorVideos" v-bind:disabled="!!busy||!competitor.urls">{{busy==='AddCompetitorVideos'?"Retrieving...":"Add or refresh videos"}}</button></div>
    <div class="ytg-alert warning" v-if="competitor.workspace" style="margin-top:14px">{{competitor.workspace.transcriptPolicy}}</div>
   </div>

   <div class="ytg-panel" style="margin-bottom:16px" v-if="competitor.workspace&&competitor.workspace.videos.length">
    <h2>Research sources</h2>
    <div class="ytg-table-wrap"><table class="ytg-table"><thead><tr><th>Rank</th><th>Video</th><th>Public performance</th><th>Transcript</th><th>Actions</th></tr></thead><tbody>
     <tr v-for="item in competitor.workspace.videos">
      <td>#{{item.performanceRank}}</td>
      <td><div class="ytg-video"><img v-bind:src="item.thumbnailUrl" alt=""><div><strong>{{item.title}}</strong><small class="ytg-muted">{{item.channelTitle||"Competitor"}} &middot; {{formatDate(item.publishedAt)}}</small><div class="ytg-badges"><span class="ytg-badge" v-for="tag in item.hashtags">{{tag}}</span></div></div></div></td>
      <td><strong>{{formatNumber(item.views)}} views</strong><br><small class="ytg-muted">{{formatRate(item)}}</small></td>
      <td><span class="ytg-badge good" v-if="item.transcript">{{item.transcript.sourceType}} &middot; {{item.transcript.language}}</span><span class="ytg-badge warn" v-if="!item.transcript">Metadata only</span></td>
      <td><div class="ytg-actions"><a class="ytg-button secondary" v-bind:href="item.watchUrl" target="_blank" rel="noopener noreferrer">Open</a><button class="ytg-button secondary" v-on:click="openCompetitorTranscript(item)">{{item.transcript?"Replace transcript":"Add transcript"}}</button><button class="ytg-button danger" v-on:click="removeCompetitorVideo(item)" v-bind:disabled="!!busy">Remove</button></div></td>
     </tr>
    </tbody></table></div>
   </div>
   <div class="ytg-panel ytg-empty" v-if="competitor.workspace&&!competitor.workspace.videos.length"><h2>No competitor videos yet</h2><p>Add one or more watch, Shorts, or youtu.be URLs above.</p></div>

   <div class="ytg-panel" style="margin-bottom:16px" v-if="competitor.transcriptVideo">
    <div class="ytg-panel-head"><div><h2>Rights-confirmed transcript</h2><p class="ytg-muted">{{competitor.transcriptVideo.title}}</p></div><button class="ytg-button secondary" v-on:click="closeCompetitorTranscript">Close</button></div>
    <div class="ytg-form-grid"><label>Language<input v-model="competitor.transcriptLanguage" placeholder="English or Sinhala"></label><label>Provenance<select v-model="competitor.sourceType"><option value="MANUAL_TEXT">Pasted text</option><option value="USER_UPLOAD">User upload</option><option value="LICENSED_PROVIDER">Licensed provider</option></select></label></div>
    <label style="margin-top:12px">Transcript file (optional)<input type="file" accept=".txt,.vtt,.srt,text/plain,text/vtt" v-on:change="loadCompetitorTranscriptFile"></label>
    <label style="margin-top:12px">Transcript text<textarea rows="10" v-model="competitor.transcriptText" placeholder="Paste transcript text that you have permission to analyse"></textarea></label>
    <label style="margin-top:12px;font-weight:400"><input type="checkbox" v-model="competitor.rightsConfirmed" style="width:auto;margin-right:8px">I confirm that I have the rights or permission to analyse this transcript.</label>
    <div class="ytg-actions" style="margin-top:12px"><button class="ytg-button" v-on:click="saveCompetitorTranscript" v-bind:disabled="!!busy||!competitor.rightsConfirmed||!competitor.transcriptText">{{busy==='ImportCompetitorTranscript'?"Saving...":"Save transcript"}}</button></div>
   </div>

   <div class="ytg-panel" style="margin-bottom:16px" v-if="competitor.workspace&&competitor.workspace.videos.length">
    <h2>Research and generate</h2><p class="ytg-muted">The app detects the owned video's main language from its transcript or metadata. Enter an override only when needed.</p>
    <div class="ytg-form-grid"><label>Language override (optional)<input v-model="competitor.languageOverride" placeholder="Sinhala, English, si, en"></label></div>
    <label style="margin-top:12px;font-weight:400"><input type="checkbox" v-model="competitor.aiConsent" style="width:auto;margin-right:8px">I confirm that this selected video context and the listed competitor evidence may be sent to the configured saved-agent provider for this request.</label>
    <div class="ytg-actions" style="margin-top:12px"><button class="ytg-button" v-on:click="generateCompetitorResearch" v-bind:disabled="!!busy||!competitor.aiConsent">{{busy==='GenerateCompetitorVideoResearch'?"Researching...":"Research and generate"}}</button></div>
   </div>

   <template v-if="competitorResearch()">
    <div class="ytg-panel" style="margin-bottom:16px"><div class="ytg-panel-head"><div><h2>Language and metadata package</h2><p class="ytg-muted">Generated from the selected owned video and cited competitor sources.</p></div><div class="ytg-badges"><span class="ytg-badge">{{competitorResearch().language.name}}</span><span class="ytg-badge">{{competitorResearch().language.confidence}} confidence</span><span class="ytg-badge">{{competitorResearch().language.source}}</span></div></div><h3>Description</h3><p style="white-space:pre-line">{{competitorResearch().description}}</p><h3>Tags</h3><div class="ytg-badges"><span class="ytg-badge" v-for="tag in competitorResearch().tags">{{tag}}</span></div></div>
    <div class="ytg-grid" style="margin-bottom:16px">
     <div class="ytg-panel ytg-col-6"><h2>Ranked keywords</h2><ol class="ytg-action-list"><li v-for="item in competitorResearch().keywords"><strong>{{item.text}}</strong><br><span>{{item.rationale}}</span><br><small class="ytg-muted">Evidence: {{evidenceText(item)}} &middot; {{item.evidenceType}} &middot; product estimate</small></li></ol></div>
     <div class="ytg-panel ytg-col-6"><h2>Ranked hashtags</h2><ol class="ytg-action-list"><li v-for="item in competitorResearch().hashtags"><strong>{{item.text}}</strong><br><span>{{item.rationale}}</span><br><small class="ytg-muted">Evidence: {{evidenceText(item)}} &middot; product estimate</small></li></ol></div>
    </div>
    <div class="ytg-panel" style="margin-bottom:16px"><h2>Three title and image-prompt pairs</h2><article class="ytg-recommendation" v-for="(pair,index) in competitorResearch().titlePromptPairs" style="padding:16px;margin:12px 0;background:#f8fafc"><div class="ytg-badges"><span class="ytg-badge">Option {{index+1}}</span><span class="ytg-badge">{{pair.angle}}</span></div><h3>{{pair.title}}</h3><p>{{pair.rationale}}</p><p><strong>Thumbnail text:</strong> {{pair.onImageText||"No text required"}}</p><p><strong>Image prompt</strong></p><div class="ytg-code" style="white-space:pre-wrap;padding:12px">{{pair.imagePrompt}}</div><small class="ytg-muted">Evidence videos: {{evidenceText(pair)}}</small></article><div class="ytg-alert warning" v-for="notice in competitorResearch().limitations">{{notice}}</div></div>
   </template>
  </div>

  <div v-if="activeTab==='actions'"><article class="ytg-panel ytg-recommendation" v-for="item in analysis.recommendations" style="margin-bottom:12px"><div class="ytg-badges"><span class="ytg-badge">{{item.type}}</span><span class="ytg-badge">{{item.status}}</span><span class="ytg-badge">{{item.confidence}}</span></div><h3>{{item.observation}}</h3><p>{{item.reasoning}}</p><ol class="ytg-action-list"><li v-for="action in item.actions">{{action}}</li></ol><p><strong>Hypothesis:</strong> {{item.hypothesis}}</p></article><div class="ytg-panel ytg-empty" v-if="!analysis.recommendations.length">No actions are attached to this video yet.</div></div>
 </template>
</section>
