<section class="ytg-shell" v-bind:class="{'ytg-skeleton':loading}">
 <header class="ytg-header"><div><button class="ytg-button secondary" v-on:click="back">← Video library</button><h1 style="margin-top:14px">{{analysis&&analysis.video?analysis.video.title:"Video Inspector"}}</h1><p>Official data and clearly separated Phase 2 analysis placeholders.</p></div><button class="ytg-button" v-on:click="syncVideo" v-bind:disabled="!!syncing">{{syncing?"Refreshing...":"Refresh video"}}</button></header><div class="ytg-alert error" v-if="error"><div>{{error}}</div><div class="ytg-alert-actions" v-if="syncErrorActions(error).length"><a class="ytg-button secondary" v-for="action in syncErrorActions(error)" v-bind:href="action.url" target="_blank" rel="noopener noreferrer">{{action.label}}</a></div></div><div class="ytg-alert" v-if="info">{{info}}</div>
 <template v-if="analysis"><div class="ytg-panel"><div class="ytg-channel-card"><img class="ytg-video" style="width:260px;max-width:40%;border-radius:9px" v-bind:src="analysis.video.thumbnailUrl" alt="" v-if="analysis.video.thumbnailUrl"><div><div class="ytg-badges"><span class="ytg-badge">{{analysis.video.contentType}}</span><span class="ytg-badge">{{analysis.video.privacyStatus}}</span><span class="ytg-badge">{{analysis.video.language||"Language not set"}}</span></div><p>{{analysis.video.description}}</p><small class="ytg-muted">Published {{formatDate(analysis.video.publishedAt)}} · {{formatDuration(analysis.video.durationSeconds)}}</small></div></div></div>
 <div class="ytg-tabs" style="margin-top:16px"><button v-for="tab in ['overview','reach','retention','actions']" v-bind:class="{active:activeTab===tab}" v-on:click="setTab(tab)">{{tab}}</button></div>
 <div class="ytg-panel" v-if="activeTab==='overview'"><h2>Metric snapshots</h2><div class="ytg-table-wrap"><table class="ytg-table"><thead><tr><th>Captured</th><th>Source</th><th>Views</th><th>Watch minutes</th><th>Avg duration</th><th>Avg percentage</th></tr></thead><tbody><tr v-for="row in analysis.statistics"><td>{{formatDate(row.capturedAt)}}</td><td><span class="ytg-source-label">{{row.source}}</span></td><td>{{formatNumber(row.views)}}</td><td>{{formatWatchMinutes(row)}}</td><td>{{formatAverageDuration(row)}}</td><td>{{formatAveragePercentage(row)}}</td></tr></tbody></table></div></div>
 <div class="ytg-panel" v-if="activeTab==='reach'"><h2>Reach and traffic sources</h2><p class="ytg-muted">Reach rows are imported from documented YouTube Reporting API jobs. The Phase 1 inspector currently exposes them through channel summaries; richer per-video visualizations remain deferred.</p></div>
 <div class="ytg-panel" v-if="activeTab==='retention'"><h2>Retention and transcript timeline</h2><div class="ytg-alert">{{analysis.phaseNotice}}</div><div class="ytg-retention-chart" v-if="analysis.retention.length"><span v-for="point in analysis.retention" v-bind:style="{height:Math.max(3,Math.min(100,Number(point.audienceWatchRatio||0)*100))+'%'}"></span></div><div class="ytg-empty" v-if="!analysis.retention.length">No official retention points have been imported for this video.</div><div v-if="analysis.transcript"><div class="ytg-badges"><span class="ytg-badge">{{analysis.transcript.sourceType}}</span><span class="ytg-badge">{{analysis.transcript.language}}</span><span class="ytg-badge">{{analysis.transcript.segments.length}} segments</span></div><p class="ytg-muted">{{analysis.transcript.provenance}}</p><div class="ytg-transcript-preview">{{analysis.transcript.plainText}}</div></div><div class="ytg-empty" v-if="!analysis.transcript">No transcript is stored. Import a user-provided transcript from Growth Studio.</div></div>
 <div v-if="activeTab==='actions'"><article class="ytg-panel ytg-recommendation" v-for="item in analysis.recommendations" style="margin-bottom:12px"><div class="ytg-badges"><span class="ytg-badge">{{item.type}}</span><span class="ytg-badge">{{item.status}}</span><span class="ytg-badge">{{item.confidence}}</span></div><h3>{{item.observation}}</h3><p>{{item.reasoning}}</p><ol class="ytg-action-list"><li v-for="action in item.actions">{{action}}</li></ol><p><strong>Hypothesis:</strong> {{item.hypothesis}}</p></article><div class="ytg-panel ytg-empty" v-if="!analysis.recommendations.length">No actions are attached to this video yet.</div></div></template>
</section>
